[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoservice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.14.3",
    "claude-agent-sdk>=0.1.21",
    "fastapi>=0.109.0",
    "httpx>=0.28.1",
    "lark-oapi>=1.3.0",
    "mcp>=1.0.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11",
    "pypdf>=6.7.4",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.0",
    "websockets>=13.0",
    "bcrypt>=4,<5",
    "email-validator>=2",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: manual-runnable acceptance tests (need ANTHROPIC_API_KEY + gh CLI + live uvicorn; excluded from default pytest — run via `pytest -m e2e`)",
    "live: opt-in live-LLM tests that actually spawn a local claude_agent_sdk subprocess (T5S.14 Dream LLM real-wire); gated on AUTOSERVICE_LIVE_OK=1 or CC_POOL_CLI_PATH — run via `pytest -m live`",
]
# Exclude e2e + live tests from default runs (they need live uvicorn +
# local SDK / LLM subprocess). Run them explicitly with `pytest -m e2e`
# or `pytest -m live`.
addopts = "-m 'not e2e and not live'"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
