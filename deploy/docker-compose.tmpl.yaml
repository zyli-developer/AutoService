# AutoService multi-tenant docker-compose template
# Render: TENANT=demo PORT_OFFSET=0 envsubst < docker-compose.tmpl.yaml > docker-compose.yml
# Required env vars: TENANT, PORT_OFFSET, ZCHAT_IMAGE, ANTHROPIC_API_KEY, CHANNEL_SERVER_URL, DEMO_PORT, TENANT_DATA_DIR

version: "3.9"

x-common-labels: &common-labels
  app.autoservice/tenant: "${TENANT}"

services:
  channel-server:
    image: "${ZCHAT_IMAGE}"
    labels:
      <<: *common-labels
    ports:
      - "${PORT_OFFSET_9999}:9999"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9999 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - autoservice-${TENANT}
    restart: unless-stopped

  bridges:
    image: "${ZCHAT_IMAGE}"
    labels:
      <<: *common-labels
    command: ["bridges"]
    network_mode: "service:channel-server"
    depends_on:
      channel-server:
        condition: service_healthy
    restart: unless-stopped

  autoservice:
    build:
      context: ..
      dockerfile: deploy/autoservice.Dockerfile
    labels:
      <<: *common-labels
    ports:
      - "${DEMO_PORT}:8000"
    environment:
      - TENANT=${TENANT}
      - DEMO_PORT=8000
      - CHANNEL_SERVER_URL=${CHANNEL_SERVER_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - ${TENANT_DATA_DIR}/.env
    volumes:
      - ${TENANT_DATA_DIR}/.autoservice:/app/.autoservice
      - ${TENANT_DATA_DIR}/.feishu-credentials.json:/app/.feishu-credentials.json:ro
      - ${TENANT_DATA_DIR}/config.local.yaml:/app/.autoservice/config.local.yaml:ro
    depends_on:
      channel-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autoservice-${TENANT}
    restart: unless-stopped

  customer-chat:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP_NAME: customer-chat
    labels:
      <<: *common-labels
    ports:
      - "${PORT_OFFSET_5173}:80"
    depends_on:
      autoservice:
        condition: service_healthy
    networks:
      - autoservice-${TENANT}
    restart: unless-stopped

  operator-console:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP_NAME: operator-console
    labels:
      <<: *common-labels
    ports:
      - "${PORT_OFFSET_5174}:80"
    depends_on:
      autoservice:
        condition: service_healthy
    networks:
      - autoservice-${TENANT}
    restart: unless-stopped

  admin-portal:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        APP_NAME: admin-portal
    labels:
      <<: *common-labels
    ports:
      - "${PORT_OFFSET_5175}:80"
    depends_on:
      autoservice:
        condition: service_healthy
    networks:
      - autoservice-${TENANT}
    restart: unless-stopped

networks:
  autoservice-${TENANT}:
    name: autoservice-${TENANT}
