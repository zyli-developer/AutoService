      change_type: modify
      purpose: "路由从 /admin/wizard 迁到 /master/tenants/new；Step 4 一键对外按钮接 /onboard/publish；Step 2 审核接 /rehearsal/review"
      source_anchor: "9----"
      related_gap_refs:
        - GAP-001
        - GAP-003

  implementation_steps:
    - step: 1
      description: "A 打开 Master：/master/tenants 租户列表（初始空）"
      touches_files:
        - "frontend/apps/admin-portal/src/App.tsx"
        - "frontend/apps/admin-portal/src/layouts/MasterLayout.tsx"
        - "frontend/apps/admin-portal/src/components/master/TenantListTab.tsx"
      depends_on_steps: []
      source_anchor: "10-m1-"

    - step: 2
      description: "A 走向导：/master/tenants/new → Step 0 上传 → Step 1 渠道 → Step 2 预演+审核 → Step 3 合规 → Step 4 沙盒就绪"
      touches_files:
        - "frontend/apps/admin-portal/src/components/wizard/WizardTab.tsx"
        - "autoservice/onboarding.py"
        - "autoservice/api_routes.py"
      depends_on_steps:
        - 1
      source_anchor: "10-m1-"

    - step: 3
      description: "沙盒产物齐全：souls/ 有 4 个 md + dream_soul.md 占位、kb/kb.db >0 chunk、rehearsal.json 12 条全 reviewed、config.json status=sandbox + channels/dream 字段正确"
      touches_files:
        - "autoservice/onboarding.py"
        - "autoservice/soul_generator.py"
        - "autoservice/dream_soul_template.md"
      depends_on_steps:
        - 2
      source_anchor: "10-m1-"

    - step: 4
      description: "Master 沙盒预览可用：/t/<tid>/chat 能对话，WS 日志可见 tenant_id 上下文"
      touches_files:
        - "frontend/apps/customer-chat/src/App.tsx"
        - "frontend/packages/shared/useTenantId.ts"
        - "autoservice/cc_pool.py"
      depends_on_steps:
        - 3
      source_anchor: "10-m1-"

    - step: 5
      description: "多租户隔离：同时启两个沙盒 X 和 Y，/t/X/chat 和 /t/Y/chat 的 agent 用各自 soul（回复风格可肉眼区分）"
      touches_files:
        - "autoservice/cc_pool.py"
        - "autoservice/onboarding.py"
      depends_on_steps:
        - 4
      source_anchor: "10-m1-"

    - step: 6
      description: "A 代入预览：/master/tenants/:id/preview 嵌入展示 /t/<tid>/chat"
      touches_files:
        - "frontend/apps/admin-portal/src/components/master/TenantPreviewTab.tsx"
        - "frontend/apps/admin-portal/src/layouts/MasterLayout.tsx"
      depends_on_steps:
        - 4
      source_anchor: "10-m1-"

    - step: 7
      description: "Dream 配置落盘：ManagementChat 走完 /dream-config，config.json.dream 有 4 参数"
      touches_files:
        - "autoservice/api_routes.py"
        - "autoservice/dream_soul_template.md"
      depends_on_steps:
        - 3
      source_anchor: "10-m1-"

    - step: 8
      description: "Publish 完整产物：点一键对外 → tarball + runbook + record 写入 → 沙盒物理移动到 archived/ → /t/<tid>/* 返回 410"
      touches_files:
        - "autoservice/publish.py"
        - "autoservice/api_routes.py"
      depends_on_steps:
        - 3
        - 7
      source_anchor: "10-m1-"

    - step: 9
      description: "Fork 手工验证：tarball 解压得到的 plugins/<tid>/ 手工 git mv 到 fork 仓，make check 通过"
      touches_files: []
      depends_on_steps:
        - 8
      source_anchor: "10-m1-"

  non_goals:
    - "把商户侧 fork 仓的生产部署真跑起来（M2）"
    - "商户登录视角的完整布局可用（M2）"
    - "提案引擎升级为独立人格驱动的智能体（M2）"
    - "自动化的 git 建仓与部署推送"
    - "成员账号邀请与权限管控体系"
    - "按商户隔离的能力集与运行进程"
    - "数据库或操作系统级的商户隔离"
    - "反向代理多级路由配置"
    - "商户自带域名接入映射"
    - "未发布沙盒超期自动清理"
    - "并发数量上限与限流"
    - "按注册国家代码筛合规子集"

  test_strategy:
    preserved_testids: []
    new_tests:
      - "test_onboarding_upload_persists_souls_and_kb.py — 验证 Step 0 产物落盘"
      - "test_activate_is_idempotent.py — 验证 Step 1 幂等 merge"
      - "test_rehearsal_review_persists.py — 验证 Step 2 审核持久化"
      - "test_publish_gate_checks.py — 验证 gate 条件 + tarball 内容 + 归档"
      - "test_cc_pool_tenant_soul_injection.py — 验证 per-tenant soul 注入"
      - "e2e_sandbox_provisioning.spec.ts — 前端 9 步 E2E 链路"
    e2e_delta: "9 步端到端沙盒 provisioning 流程：从 /master/tenants 创建到 /publish 产出 tarball，覆盖多租户隔离和代入预览"

  risks:
    - risk: "cc_pool 已 warm 的 worker 若必须在启动时就固定 system prompt，则无法按 tenant 动态注入"
      mitigation: "在 writing-plans 阶段核实 cc_pool 实际 worker 生命周期；最坏情况改为按 tenant 维护小池 + LRU 回收，不改变路由层接口"

    - risk: "向导 Step 0 生成 dream_soul.md 静态模板，但 proposal_pipeline / dream_config_dialog 仍读内存，可能造成 tenant 行为差异不显著"
      mitigation: "M1 只作为 publish tarball 占位；M2 proposal_pipeline 改造时真正切到读 tenant dream_soul"

    - risk: "沙盒与 fork 双运行时路径导致前端 URL 规则容易写错（/t/<id>/chat vs /chat）"
      mitigation: "useTenantId hook 统一屏蔽；fork 侧接受两种 URL 形态并做 assertion"
