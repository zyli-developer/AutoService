    estimated_tasks: "8-12"
    risk_level: medium
    risk_factors:
      - "Session security: operator_session cookie separation must be airtight to prevent privilege confusion"
      - "WS handshake validation touches channel_server — risk of breaking existing connections"
      - "RBAC permission matrix is a cross-cutting concern; late bugs expensive"
    suggested_type_split:
      green: 6
      yellow: 3
      red: 1

  - module: MOD-E2
    status: DEFERRED_M4
    estimated_tasks: "0 (in M3)"
    risk_level: n/a
    errata_note: "Entire Epic E2 deferred to M4+ per §8.1 Errata final decision (2026-04-21). v1.1 §8 whitelabel OoS. No task-gen; no gap remediation."

  - module: MOD-E3
    estimated_tasks: "6-9"
    risk_level: medium
    risk_factors:
      - "SLA threshold tuning is operational — likely needs multiple iterations"
      - "Handoff parser must handle adversarial/malformed agent output"
      - "History compression LLM call introduces latency and cost; budget risk"
    suggested_type_split:
