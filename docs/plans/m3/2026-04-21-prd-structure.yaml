source_type: extracted
source_prd: docs/prd/AutoService-M3-PRD.md
extracted_at: "2026-04-21"
milestone: M3
prerequisite_baselines:
  - "M2 tenant-sandbox (plugins/<tid>/souls/* fork runtime)"
  - "M2 triage dispatch (customer→customer/lead/translate routing)"
  - "M2 cc_pool lazy subpool"
  - "_master + _local_admin built-in tenants"
  - "Magic-link admin auth"

# -----------------------------------------------------------------------------
# Modules (Epics)
# -----------------------------------------------------------------------------
modules:
  - id: MOD-E1
    name: "Identity & RBAC"
    description: >
      Multi-layer identity system (operator/client/admin) with per-tenant team
      management. Covers operator auth, team invites, RBAC coarse-grained 3-tier,
      multi-admin support.
    prd_sections: ["§2 Epic E1"]
    sub_modules: []

  - id: MOD-E2
    name: "[DEFERRED_M4] Subtenant / Whitelabel / Referral"
    status: DEFERRED_M4
    description: >
      **Final decision (2026-04-21, A confirmed):** Entire Epic E2 descoped from
      M3 to M4+. Evidence: (1) AutoService-PRD-v1.1.md §8 Out of Scope lists
      whitelabel as not-in-scope; (2) AutoService-UserStories-v1.1.md 17 stories
      have zero subtenant/tier_2/referral entries; (3) M3 PRD's Epic E2 was a
      scope expansion beyond v1.1 without v1.2 PRD authorization. Applying the
      same "PRD 没有就不做" principle that dropped revshare% and B-visibility
      details, all 6 E2 stories are now tombstones (DEFERRED_M4) for traceability.
      Intermediate flat-peer-referral design (errata phase 1) is also NOT adopted.
      Any M4+ revival requires v1.2 PRD expansion first.
    prd_sections: ["§8.1 Errata"]
    sub_modules: []

  - id: MOD-E3
    name: "Triage Dispatch Enhancement"
    description: >
      Completes M2's triage dispatch deferred items: SLA monitoring with pool
      busy metrics, handoff protocol (<handoff to=X>), DB-backed classify_intent
      config, conversation history compression for re-seed.
    prd_sections: ["§2 Epic E3"]
    sub_modules: []

  - id: MOD-E4
    name: "Compliance Deepening"
    description: >
      Closes PRD gap A-④: filter compliance templates by tenant.countries; add
      3-5 country rulesets (JP/SG/AU etc). Rules remain hardcoded (hot-reload
      deferred to M4+).
    prd_sections: ["§2 Epic E4"]
    sub_modules: []

  - id: MOD-E5
    name: "Dream Extension"
    description: >
      Platform-level dream agent (master-side, aggregate signals → platform
      improvement proposals) + semi-automatic apply (one-button after A review).
      Red line: dream never auto-applies.
    prd_sections: ["§2 Epic E5"]
    sub_modules: []

  - id: MOD-E6
    name: "Operations & Deployment"
    description: >
      Supports 5-10 tenant internal beta: sandbox GC (30-day archive) and
      Playwright E2E scripting for 17-story coverage.
    prd_sections: ["§2 Epic E6"]
    sub_modules: []

# -----------------------------------------------------------------------------
# User Stories (22 total — PRD §3.1 miscounts as 18; see flagged_items)
# -----------------------------------------------------------------------------
user_stories:
  # ---- E1 Identity & RBAC ----
  - id: E1.1
    module: MOD-E1
    persona: "Operator (customer service staff)"
    action: "Log in via credentials and get a session"
    goal: "Access only own tenant's conversations; WS handshake validates identity"
    priority: P0
    acceptance_criteria:
      - "Operator can log in and receive operator_session cookie"
      - "WS handshake enforces operator identity; failure rate < 1%"
      - "Session persisted in .autoservice/database/sessions.db"
    prd_ref: "§2 E1.1 / §6.1 / §6.2"

  - id: E1.2
    module: MOD-E1
    persona: "Tenant admin"
    action: "CRUD per-tenant operator list"
    goal: "Manage operator roster for own tenant"
    priority: P0
    acceptance_criteria:
      - "Admin can create/read/update/delete operators scoped to own tenant"
      - "List endpoint enforces tenant-scoped filter"
    prd_ref: "§2 E1.2"

  - id: E1.3
    module: MOD-E1
    persona: "Tenant admin"
    action: "Send operator team invite links (magic-link reused)"
    goal: "Onboard operators without manual credential handoff"
    priority: P0
    acceptance_criteria:
      - "Admin generates magic-link invite for operator role"
      - "Invitee completes signup via link and lands in correct tenant"
    prd_ref: "§2 E1.3 / §6.1"

  - id: E1.4
    module: MOD-E1
    persona: "Any authenticated user"
    action: "Operate under coarse 3-tier RBAC (viewer/responder/admin)"
    goal: "Permissions enforced on all sensitive endpoints and UI"
    priority: P1
    acceptance_criteria:
      - "Permission matrix hardcoded in source (not runtime config)"
      - "RBAC decision P95 < 5ms"
      - "viewer cannot /hijack; responder cannot invite; admin can both"
    prd_ref: "§2 E1.4 / §6.2 / §7 takeover-release"

  - id: E1.5
    module: MOD-E1
    persona: "Tenant admin"
    action: "Support ≥2 admins per tenant with identical permissions"
    goal: "No single-admin lock-in; co-admin management possible"
    priority: P1
    acceptance_criteria:
      - "1 tenant can host multiple tenant_admin records"
      - "All admins see same view and can perform same actions"
    prd_ref: "§2 E1.5 / §6.1"

  - id: E1.6
    module: MOD-E1
    persona: "Existing tenant admin"
    action: "Invite another admin via magic-link"
    goal: "Delegate admin rights without platform admin intervention"
    priority: P2
    acceptance_criteria:
      - "Admin invite link promotes invitee to tenant_admin role on acceptance"
    prd_ref: "§2 E1.6"

  # ---- E2 ALL DEFERRED_M4 (final decision 2026-04-21) ----
  # Reason: v1.1 §8 Out of Scope lists whitelabel as not-in-scope; v1.1 UserStories
  # has zero subtenant/tier_2/referral entries. Entire Epic E2 (original 6 stories
  # AND the interim flat-peer-referral redesign) moved to M4+. Tombstones retained
  # for cross-document ID continuity. Any M4+ revival requires v1.2 PRD first.
  - id: E2.1
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; no v1.2 authorization for subtenant enable toggle"
    prd_ref: "§8.1 Errata"
  - id: E2.2
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; ControlLayout is tier_2 concept"
    prd_ref: "§8.1 Errata"
  - id: E2.3
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; both subtenant wizard and flat-peer referral variant deferred"
    prd_ref: "§8.1 Errata"
  - id: E2.4
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; fork-internal emplace not in scope"
    prd_ref: "§8.1 Errata"
  - id: E2.5
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; tier_2 billing + referral line-items both deferred"
    prd_ref: "§8.1 Errata"
  - id: E2.6
    module: MOD-E2
    status: DEFERRED_M4
    reason: "v1.1 §8 whitelabel OoS; trivially covered by E4.1 if ever resurrected"
    prd_ref: "§8.1 Errata"

  # ---- E3 Triage Enhancement ----
  - id: E3.1
    module: MOD-E3
    persona: "Operator / operator-console"
    action: "Receive alert when target role pool wait time exceeds per-tenant SLA threshold"
    goal: "M2 SLA promise operationalized"
    priority: P1
    acceptance_criteria:
      - "pool busy metrics emitted + wait time measured"
      - "Per-tenant SLA threshold configurable"
      - "Alert surfaces in operator-console when exceeded"
    prd_ref: "§2 E3.1 / §6.1"

  - id: E3.2
    module: MOD-E3
    persona: "Agent soul"
    action: "Emit <handoff to='X'>; parser triggers re-triage and role switch"
    goal: "In-conversation role transitions without human intervention"
    priority: P1
    acceptance_criteria:
      - "Parser recognizes <handoff to=X> tag"
      - "Re-triage switches to role X and replays context per protocol"
    prd_ref: "§2 E3.2 / §6.1 / §7 triage-dispatch-design"

  - id: E3.3
    module: MOD-E3
    persona: "Tenant admin"
    action: "Edit classify_intent keywords via admin-portal UI"
    goal: "Tune intent classification without code changes; hot-effective"
    priority: P2
    acceptance_criteria:
      - "classify_intent config DB-backed"
      - "admin-portal keyword editor exists (extension, not new page)"
      - "Edits take effect without service restart"
    prd_ref: "§2 E3.3 / §6.1"

  - id: E3.4
    module: MOD-E3
    persona: "System (re-triage flow)"
    action: "Compress conversation history (>20 messages) via LLM summary; re-seed new role with summary"
    goal: "Keep context usable when switching roles without blowing token budget"
    priority: P2
    acceptance_criteria:
      - "History compression service operational"
      - "Role switch after ≥20 messages uses summary, not full log"
    prd_ref: "§2 E3.4 / §6.1"

  # ---- E4 Compliance ----
  - id: E4.1
    module: MOD-E4
    persona: "System (compliance engine)"
    action: "Filter 16 compliance templates by tenant.countries"
    goal: "Tenants see only rules relevant to their operating countries"
    priority: P1
    acceptance_criteria:
      - "US tenant does not see EU-only rules"
      - "Country codes in ISO 3166-1 alpha-2"
    prd_ref: "§2 E4.1 / §6.1"

  - id: E4.2
    module: MOD-E4
    persona: "Compliance team / developers"
    action: "Ship 3-5 new country rulesets (JP/SG/AU etc)"
    goal: "Expand country coverage for internal beta"
    priority: P2
    acceptance_criteria:
      - "Rulesets land in repo (hardcoded)"
      - "Passes E4.1 filter for respective countries"
    prd_ref: "§2 E4.2"

  # ---- E5 Dream ----
  - id: E5.1
    module: MOD-E5
    persona: "Platform admin (A)"
    action: "Run platform-level dream agent that aggregates signals across tenants and emits platform-level proposals"
    goal: "Platform improvements (skill / cc_pool policy) surface from cross-tenant data"
    priority: P2
    acceptance_criteria:
      - "Master-side dream agent runs"
      - "Produces platform-level proposal artifact with status='draft'"
    prd_ref: "§2 E5.1"

  - id: E5.2
    module: MOD-E5
    persona: "Platform admin (A)"
    action: "After reviewing proposal, click 'apply' button to land low-risk proposal"
    goal: "Tighten dream review→apply loop without crossing red line"
    priority: P2
    acceptance_criteria:
      - "apply_proposal(pid, admin_user_id) requires proposal status='accepted'"
      - "A's admin identity audit-logged"
      - "Proposal state transitions: draft → accepted → applied"
      - "NO code path allows dream agent to write accepted/applied directly"
    prd_ref: "§2 E5.2 / CON-04 red line"

  # ---- E6 Ops ----
  - id: E6.1
    module: MOD-E6
    persona: "System (background GC)"
    action: "Archive sandboxes that haven't published for 30 days (configurable per tenant)"
    goal: "Reclaim storage from abandoned sandbox sessions"
    priority: P2
    acceptance_criteria:
      - "GC job runs and archives eligible sandboxes"
      - "Per-tenant override respected"
    prd_ref: "§2 E6.1"

  - id: E6.2
    module: MOD-E6
    persona: "QA / CI"
    action: "Run 17-story Playwright E2E suite"
    goal: "Automated regression coverage across M3 user flows"
    priority: P2
    acceptance_criteria:
      - "Playwright script covers all 17 stories from M5 Batch 14 reference"
      - "Suite runs green OR explicitly deferred to M3.5 at gate time"
    prd_ref: "§2 E6.2 / §5 decision 7 / §6.1"

