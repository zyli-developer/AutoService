# -----------------------------------------------------------------------------
# Technical Constraints
# -----------------------------------------------------------------------------
constraints:
  - id: CON-01
    type: architecture
    description: >
      Session storage MUST use SQLite; do not introduce Redis.
      [DISCREPANCY 2026-04-21] PRD §5 decision 2 names `.autoservice/database/sessions.db`,
      but current M2 code uses `.autoservice/database/auth.db` (see auth.py:307).
      Open question OQ-3 (E1 spec): keep auth.db or rename to sessions.db? Defaulting to
      auth.db until user decides (changing name breaks M2 regression).
    rationale: "Reduce deployment dependency footprint; A pinned decision 2026-04-21"
    prd_ref: "§5 decision 2 / §2 E1 constraints"

  - id: CON-02
    type: architecture
    description: "RBAC is coarse 3-tier (viewer/responder/admin); permission matrix hardcoded in source"
    rationale: "Fast ship; fine-grained permissions punted to M4+"
    prd_ref: "§5 decision 3 / §2 E1 constraints"

  - id: CON-03
    type: architecture
    status: DELETED_2026-04-21
    description: "[DELETED] Original: Subtenant URL /t/<b>/t/<c>/. Overturned by §8.1 Errata — tenants are flat; C uses /t/<c>/ (peer of B)."
    rationale: "CLAUDE.md glossary forbids tenant nesting"
    prd_ref: "§8.1 Errata"

  - id: CON-04
    type: architecture
    description: >
      DREAM RED LINE: dream_agent.emit_proposal(status='draft') is hardcoded. Dream
      agents MAY NEVER write status='accepted' or status='applied' directly. All
      transitions require explicit human-initiated apply_proposal(pid, admin_user_id).
      PRs attempting to bypass this are rejected on sight.
    rationale: "Irreversible auto-apply is a trust-killer; A explicit red line"
    prd_ref: "§2 E5 red-line constraints / §1.3 non-goals"

  - id: CON-05
    type: data
    description: "Country codes use ISO 3166-1 alpha-2"
    rationale: "Industry standard; matches existing compliance template schema"
    prd_ref: "§2 E4 constraints"

  - id: CON-06
    type: deployment
    description: "Compliance rules remain hardcoded in repo; runtime hot-reload deferred to M4+"
    rationale: "Ship simple; hot-reload needs governance story"
    prd_ref: "§2 E4 constraints / §1.3 non-goals"

  - id: CON-07
    type: architecture
    description: >
      [REVISED 2026-04-21] Commercial relationship B→C tracked via tenant_referrals
      table; B's monthly bill displays referred tenants' usage as a line group
      (read-only). NO revshare% calculation in M3 (PRD defines no percentage).
      Original wording 'B collects from C at tier_2 rate' is deferred.
    rationale: "Whitelabel commercial intent preserved; implementation decoupled from architecture per §8.1 Errata"
    prd_ref: "§8.1 Errata / §5 decision 5 (revised)"

  - id: CON-08
    type: architecture
    description: >
      Operator session cookie MUST be separate from admin cookie.
      [DISCREPANCY 2026-04-21] PRD §2 E1 names the existing admin cookie `admin_session`,
      but M2 code actually uses `auth_session` (see auth.py:307, api_routes.py:1641).
      Open question OQ-1 (E1 spec): use `operator_session` vs existing `auth_session`
      (default), or rename admin cookie to `admin_session` for consistency with PRD naming?
      Renaming carries regression risk.
    rationale: "Prevent privilege confusion across role boundaries"
    prd_ref: "§2 E1 constraints"

  - id: CON-09
    type: architecture
    description: >
      [REVISED 2026-04-21] B and C are flat peer tenants — architectural isolation
      is inherent (no engineering work). Original 'default-deny with C authorization'
      is moot. Cross-tenant visibility remains out of scope for M3.
    rationale: "§8.1 Errata — no nesting means no special isolation layer needed"
    prd_ref: "§8.1 Errata"

  - id: CON-10
    type: architecture
    description: "E3.3 admin UI for classify_intent keyword editing is an admin-portal extension, not a standalone page"
    rationale: "Consistency with existing admin surface"
    prd_ref: "§2 E3 constraints"

  - id: CON-11
    type: architecture
    description: "History compression service (E3.4) targets triage re-seed only in M3; broad rollout to dream/triage internals deferred to M4+"
    rationale: "Scope control; one use case to validate"
    prd_ref: "§2 E3 constraints"

  - id: CON-12
    type: architecture
    description: "SLA (E3.1) implemented before Handoff (E3.2)"
    rationale: "SLA is M2-commitment debt; Handoff depends on agent maturity"
    prd_ref: "§5 decision 6 / §2 E3"

  - id: CON-13
    type: deployment
    description: "Playwright (E6.2) may fall back to M3.5 mini-sprint; does NOT block M3 gate"
    rationale: "§5 decision 7; gate risk mitigation"
    prd_ref: "§5 decision 7 / §2 E6 constraints"

