      yellow: 3
      red: 1

  - module: MOD-E4
    estimated_tasks: "3-5"
    risk_level: low
    risk_factors:
      - "Straightforward filter; bigger risk is rule correctness, not engineering"
    suggested_type_split:
      green: 3
      yellow: 1
      red: 0

  - module: MOD-E5
    estimated_tasks: "4-6"
    risk_level: high
    risk_factors:
      - "CON-04 red line: any bug that lets dream auto-apply is a trust-killer — requires audit-grade review"
      - "Platform-level dream sees cross-tenant data — privacy boundaries non-trivial"
    suggested_type_split:
      green: 2
      yellow: 2
      red: 2

  - module: MOD-E6
    estimated_tasks: "4-6"
    risk_level: low
    risk_factors:
      - "GC cron reliability (clock skew, partial failures)"
      - "Playwright flakiness historically a problem; mitigated by M3.5 fallback"
    suggested_type_split:
      green: 4
      yellow: 1
      red: 0

# -----------------------------------------------------------------------------
# Flagged Items Needing Clarification
# -----------------------------------------------------------------------------
flagged_items:
  - id: FLAG-01
    type: inconsistency
    description: >
      PRD §3.1 summarizes "全量 P0/P1/P2 一览（18 story）" with breakdown P0(3)+P1(8)+P2(7)=18.
      But §2 Epic tables enumerate 22 distinct stories. Recount: P0=3 (E1.1-3), P1=9
      (E1.4, E1.5, E2.1-4, E3.1, E3.2, E4.1), P2=10 (E1.6, E2.5, E2.6, E3.3, E3.4, E4.2,
      E5.1, E5.2, E6.1, E6.2). §3.1 summary undercounts by 4.
    suggested_action: "Confirm all 22 stories are in scope (assume yes — §5 decision 1 says 'P0+P1+P2 全部'); update §3.1 summary."
    severity: low

  - id: FLAG-02
    type: unclear_scope
    description: >
      E3.4 history compression service — PRD §2 E3 constraints say "M3 只做 triage re-seed
      用例；广泛铺开到 dream/triage agent 本身留 M4+". Does "广泛铺开" include reusing the service
      for dream-agent's own context pruning in M3, or strictly M3 = triage re-seed only?
    suggested_action: "Confirm E3.4 service scope: triage-re-seed-only, or also dream context?"
    severity: low

  - id: FLAG-03
    type: missing_metric
    description: >
      NFR-04 "M2 full regression green" — what is the regression suite's current baseline?
      Need authoritative test list to make 'green' verifiable at gate.
    suggested_action: "Point to specific test command (e.g., make test-m2) or test plan artifact for gate."
    severity: medium

  - id: FLAG-04
    type: missing_spec
    status: RESOLVED_2026-04-21
    description: >
      §7 table references specs for E1/E2/E3/E4 background, but no M3-specific design specs exist
      yet for these Epics. §9 step 1 directs brainstorm→writing-plans per Epic; this is required
      by NFR-06 (1 spec per Epic).
    resolution: >
      5 specs produced 2026-04-21 (E1/E3/E4/E5/E6). E2 intentionally skipped per §8.1 Errata
      (DEFERRED_M4). See gap-analysis.yaml nfr_gaps.NFR-06 for paths + line counts.
    severity: medium

  - id: FLAG-05
    type: dependency
    status: RESOLVED_2026-04-21
