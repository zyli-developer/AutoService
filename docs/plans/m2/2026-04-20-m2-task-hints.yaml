    - "Multiple admin login; admin invitations"
    - "E2E scripting (deferred until M3 stabilizes)"

  test_strategy:
    preserved_testids: []
    new_tests:
      - "tests/bootstrap/test_get_deployment_mode.py"
      - "tests/bootstrap/test_ensure_master_tenant.py"
      - "tests/bootstrap/test_ensure_local_admin.py"
      - "tests/soul_generator/test_dream_role.py"
      - "tests/dream_agent/test_emit_proposal_tool.py"
      - "tests/dream_agent/test_kb_search_tool.py"
      - "tests/dream_agent/test_list_souls_tool.py"
      - "tests/dream_agent/test_run_dream.py"
      - "tests/dream_scheduler/test_should_trigger.py"
      - "tests/dream_scheduler/test_scheduler_loop.py"
      - "tests/auth/test_request_login.py"
      - "tests/auth/test_verify.py"
      - "tests/auth/test_logout.py"
      - "tests/auth/test_require_tenant_access.py"
      - "tests/auth/test_session_mode.py"
      - "tests/migrations/test_proposals_tenant_id_migration.py"
      - "tests/migrations/test_memory_pool_tenant_id_migration.py"
      - "tests/fork_runtime/ (suite)"
    e2e_delta: |
      M2 acceptance E2E (manual, @pytest.mark.e2e — slow, needs Anthropic key + gh CLI + real uvicorn):
      1. Master wizard creates tenant B → publish tarball → archive sandbox
      2. Runbook or fork_creator=github_api forks; tarball extracts to fork repo plugins/B/;
         ForkCreator writes .autoservice/config.local.yaml with deployment_mode=tenant + tenant_id=B
      3. Fork repo: make setup && make run-web boots cleanly
      4. Browser GET http://fork-host:8000/chat (no /t/<tid>/ prefix) → conversation works
      5. admin-portal magic-link login → TenantLayout renders B's 4 tabs
      6. After 5-turn conversation, Dream agent triggers via dream.trigger=idle
         → proposals table gets new row; dream_runs table has run record
      7. Back on Master: http://master:8000/admin/chat → conversation with _master
         → _master dream produces platform-level proposal
      8. In admin-portal Proposals tab, approve/reject a proposal → status persists

  risks:
    - risk: "Dream agent cost explosion (idle detection too loose, repeated wake-ups)"
      mitigation: "idle_threshold_min=30 default; 1h cool-down hard-coded after run_dream completes"
    - risk: "Dream infinite loop (LLM never calls emit_proposal, just keeps querying KB)"
      mitigation: "max_tool_turns=10 hard cap; force finalize on overrun"
    - risk: "_master self-iteration feedback loop drift"
      mitigation: "proposal must have status='draft' and require human-A review; dream never auto-applies soul changes (red line)"
    - risk: "proposals table migration breaks existing data"
      mitigation: "ALTER TABLE ... DEFAULT '_master' + migration script backfill; run M1 test baseline first"
    - risk: "Fork repo missing config.local.yaml"
      mitigation: "bootstrap.get_deployment_mode() asserts at startup with clear error pointing to missing step"
    - risk: "cc_pool dream client starves customer pool slots"
      mitigation: "role='dream' uses independent dream_pool (size=1); not part of general pool"
    - risk: "Admin-portal AuthGate first-frame flicker"
      mitigation: "AuthGate loading state renders <Splash />; only judge after useSessionMode completes"
    - risk: "Magic-link token HTTP sniffing in dev"
      mitigation: "Dev mode accepts risk; deployment runbook adds HTTPS-required warning"
    - risk: "GitHubApiForkCreator partial failure leaves residual state"
      mitigation: "Failure does not auto gh repo delete (requires human confirmation); return clearly names the fork to clean up"
    - risk: "ManagementChat regression — switching from stub LLM to _master"
      mitigation: "Phase 1 writes _master bootstrap tests; Phase 6 branching preceded by master-behavior no-regression baseline"
