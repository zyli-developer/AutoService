  non_goals:
    # From spec §0.2 Out of scope (M3+)
    - "Subtenant (tier=2) materialization (B creates C via wizard / whitelabel capability)"
    - "Operator / client authentication; team invitations; RBAC"
    - "Platform-level dream (aggregating all-tenant signals for platform-level improvements, brainstorm Q2-B)"
    - "Merchant custom domains / wildcard DNS / domain_routing table"
    - "Compliance templates filtered by `countries` (gap A-④)"
    - "Sandbox GC (cleanup of over-due unpublished sandboxes)"
    - "OAuth / SSO / 2FA / passkey"
    - "Dream proposal auto-apply (NEVER — red line)"
    - "Dream cross-tenant learning"
