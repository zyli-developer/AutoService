# Warnings
# ─────────────────────────────────────────────────────────────
warnings:
  - "W1: T5S.14 (D5) requires code-reviewer APPROVED (CON-04 red-line)."
  - "W2: T5S.12 (D2) reviewer must verify Apply button does not bypass /api/admin/proposals/{id}/apply."
  - "W3: T5S.13 (D3) stays blocked throughout this Dream cut. Not a gate blocker."
  - "W4: Phase-2 (Playwright + non-Dream UI) artifacts stay in docs/plans/m3.5/ — do NOT delete. Re-activation will restore the 5-batch plan."
  - "W5: No /ingest-docs run preceded task-gen — tasks carry traceability=sprint-doc-direct. Retro/contract-check skip story cross-checks."
